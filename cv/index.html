<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ge Yu — CV</title>
    <meta name="robots" content="noindex" />
    <!--
      Keeps the old /cv/ address working: the CV itself is the PDF.
      To publish a new CV, replace /assets/pdf/cv.pdf (nothing here needs to change).
    -->
    <meta http-equiv="refresh" content="0; url=/assets/pdf/cv.pdf" />
    <meta name="theme-color" content="#004932" />
    <link rel="icon" type="image/png" href="/assets/img/icon.png" />
    <script>
      window.location.replace("/assets/pdf/cv.pdf");
    </script>
    <style>
      body {
        font-family: "PT Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #fcfbf5;
        color: #1a1a1a;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
      }
      a {
        color: #004932;
      }
    </style>
  </head>
  <body>
    <p>
      Redirecting to the CV of Ge Yu…<br />
      If nothing happens, <a href="/assets/pdf/cv.pdf">open the PDF here</a>.
    </p>
  </body>
</html>
